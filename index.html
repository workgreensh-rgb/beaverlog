<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비버의 아카이브 — BEAVER'S ARCHIVE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bark: #201811;        /* 깊은 수피 갈색 (배경) */
    --log: #2b2117;         /* 통나무 카드 */
    --log-edge: #3a2d1f;    /* 카드 테두리 */
    --paper: #efe5d3;       /* 본문 글자 */
    --paper-dim: #a9977d;   /* 보조 글자 */
    --river: #6fb3aa;       /* 강물 청록 (액센트) */
    --amber: #c9975a;       /* 호박색 (스터디) */
    --moss: #8ca86b;        /* 이끼 (콜) */
    --clay: #c97b63;        /* 진흙 (매매일지) */
    --sky: #8fa6c9;         /* 하늘 (시황) */
    --violet: #a493d1;      /* 보라 (AI) */
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  /* PC: 브라우저 80% 배율과 같은 밀도로 표시 (모바일은 원래 크기) */
  @media (min-width: 900px) { body { zoom: 0.8; } }
  body {
    background: var(--bark);
    color: var(--paper);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    line-height: 1.65;
    min-height: 100vh;
  }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 22px clamp(18px, 4vw, 56px) 80px; }

  /* ── 헤더 ── */
  header { margin-bottom: 18px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.22em; color: var(--river);
    text-transform: uppercase; margin-bottom: 4px; font-weight: 600;
  }
  h1 {
    font-family: 'Gowun Batang', serif;
    font-size: clamp(24px, 4.6vw, 30px);
    font-weight: 700; letter-spacing: -0.01em; line-height: 1.15;
  }
  h1 .homebeaver { text-decoration: none; cursor: pointer; }
  h1 .homebeaver:hover { filter: brightness(1.2); }
  .homebeaver { text-decoration: none; cursor: pointer; display: inline-block; transition: transform .15s; }
  .homebeaver:hover, .homebeaver:focus-visible { transform: scale(1.12); outline: none; }
  .tagline { color: var(--paper-dim); font-size: 14px; margin-top: 4px; }
  .sitedesc { color: var(--amber); font-size: 12.5px; margin-top: 5px; letter-spacing: 0.02em; }
  .byline { font-size: 12.5px; color: #7d6c54; margin-top: 2px; }
  .byline .role { letter-spacing: 0.14em; color: var(--river); font-size: 10.5px; margin-right: 6px; }
  .headrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

  /* 잠금 해제 */
  .lockbox { flex-shrink: 0; margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
  .writebtn {
    background: none; border: 1px solid var(--log-edge); color: var(--paper-dim);
    border-radius: 999px; padding: 7px 14px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: color .15s, border-color .15s;
  }
  .writebtn:hover, .writebtn:focus-visible { color: var(--amber); border-color: var(--amber); outline: none; }

  /* 글쓰기 에디터 */
  .editor {
    display: none; background: var(--log); border: 1px solid var(--log-edge);
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 22px;
  }
  .editor.show { display: block; }
  .editor h3 { font-family: 'Gowun Batang', serif; font-size: 17px; margin-bottom: 14px; color: var(--paper); }
  .editor .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .editor input[type="text"], .editor textarea, .editor select {
    width: 100%; background: var(--bark); border: 1px solid var(--log-edge);
    border-radius: 10px; color: var(--paper); padding: 10px 12px; font-size: 14px;
    font-family: inherit;
  }
  .editor input:focus-visible, .editor textarea:focus-visible, .editor select:focus-visible { outline: none; border-color: var(--river); }
  .editor textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
  .editor select { width: auto; }
  .editor label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--paper-dim); cursor: pointer; }
  .editor .filelabel {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--paper-dim);
    border: 1px dashed var(--log-edge); border-radius: 10px; padding: 9px 13px; cursor: pointer;
  }
  .editor .filelabel:hover { color: var(--river); border-color: var(--river); }
  .editor .filelist { font-size: 12.5px; color: var(--paper-dim); margin-top: 6px; line-height: 2; }
  .editor .inspin {
    background: none; border: 1px solid var(--log-edge); color: var(--river);
    border-radius: 8px; padding: 3px 9px; font-size: 11.5px; cursor: pointer;
    font-family: inherit; margin-left: 6px;
  }
  .editor .inspin:hover { border-color: var(--river); }
  .editor .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; align-items: center; }
  .editor .status { font-size: 12.5px; color: var(--paper-dim); margin-right: auto; }
  .editor .publish {
    background: var(--river); border: none; color: var(--bark); font-weight: 600;
    border-radius: 10px; padding: 10px 18px; font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  .editor .publish:disabled { opacity: 0.5; cursor: default; }
  .editor .cancel {
    background: none; border: 1px solid var(--log-edge); color: var(--paper-dim);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .lockbtn {
    background: none; border: 1px solid var(--log-edge); color: var(--paper-dim);
    border-radius: 999px; padding: 7px 14px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: color .15s, border-color .15s;
  }
  .lockbtn:hover, .lockbtn:focus-visible { color: var(--river); border-color: var(--river); outline: none; }
  .lockbtn.on { color: var(--river); border-color: var(--river); }
  .keyform { display: none; gap: 6px; }
  .keyform.show { display: flex; }
  .keyform input {
    width: 110px; background: var(--log); border: 1px solid var(--log-edge);
    border-radius: 8px; color: var(--paper); padding: 7px 10px; font-size: 13px;
    font-family: inherit;
  }
  .keyform input:focus-visible { outline: none; border-color: var(--river); }
  .keyform button {
    background: var(--river); border: none; color: var(--bark); font-weight: 600;
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }

  /* ── 필터 ── */
  .filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .filters button {
    background: none; border: 1px solid var(--log-edge); color: var(--paper-dim);
    border-radius: 999px; padding: 6px 16px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .filters button.active { background: var(--paper); color: var(--bark); border-color: var(--paper); font-weight: 600; }
  .filters button:focus-visible { outline: 2px solid var(--river); outline-offset: 2px; }

  /* ── 글 목록: 쌓인 통나무 ── */
  .post {
    background: var(--log); border: 1px solid var(--log-edge);
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 14px;
    position: relative;
  }
  .post-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

  /* 시그니처: 나이테 배지 — 카테고리마다 나이테 색이 다름 */
  .ring {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background:
      radial-gradient(circle at 45% 45%,
        var(--ring-c) 0 3px, var(--log) 3px 5px,
        var(--ring-c) 5px 7px, var(--log) 7px 9px,
        var(--ring-c) 9px 11px);
    border: 1.5px solid var(--ring-c);
  }
  .post[data-cat="스터디"] { --ring-c: var(--amber); }
  .post[data-cat="생각"]   { --ring-c: var(--river); }
  .post[data-cat="시황"]   { --ring-c: var(--sky); }
  .post[data-cat="AI"]     { --ring-c: var(--violet); }
  .post[data-cat="콜"]     { --ring-c: var(--moss); }
  .post[data-cat="매매일지"] { --ring-c: var(--clay); }

  .trade { margin-top: 4px; }
  .trade-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .trade-side { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 8px; letter-spacing: 0.02em; }
  .trade-side.buy { background: rgba(217,119,107,0.16); color: #e58f84; }
  .trade-side.sell { background: rgba(111,159,216,0.16); color: #8db5e6; }
  .trade-sym { font-size: 22px; font-weight: 700; color: var(--paper); }
  .trade-code { font-size: 13px; color: var(--paper-dim); }
  .trade-mock { font-size: 11px; color: var(--paper-dim); border: 1px solid var(--log-edge); border-radius: 6px; padding: 2px 7px; }
  .trade-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .trade-stat { background: rgba(255,255,255,0.03); border: 1px solid var(--log-edge); border-radius: 10px; padding: 10px 12px; }
  .trade-stat .k { font-size: 11px; color: var(--paper-dim); margin-bottom: 4px; }
  .trade-stat .v { font-size: 16px; font-weight: 600; color: var(--paper); font-variant-numeric: tabular-nums; }
  .trade-link { font-size: 14px; padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--log-edge); color: var(--paper); }
  .trade-link .up { color: #e58f84; font-weight: 700; } .trade-link .down { color: #8db5e6; font-weight: 700; }
  .trade-reason { border-left: 3px solid var(--clay); padding: 8px 0 8px 14px; margin-bottom: 10px; }
  .trade-reason .k { font-size: 11px; color: var(--clay); font-weight: 600; margin-bottom: 4px; letter-spacing: 0.04em; }
  .trade-reason .v { font-size: 15px; line-height: 1.7; color: var(--paper); white-space: pre-wrap; }
  .trade-reason.is-empty .v { color: var(--paper-dim); font-size: 14px; }
  .trade-reason.prev { border-left-color: var(--log-edge); } .trade-reason.prev .k { color: var(--paper-dim); }
  .trade-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--paper-dim); }
  .trade-raw summary { cursor: pointer; list-style: none; } .trade-raw summary::-webkit-details-marker { display: none; }
  .trade-raw pre { margin-top: 8px; white-space: pre-wrap; font-family: inherit; font-size: 13px; color: var(--paper-dim); background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px 12px; }
  @media (max-width: 520px) { .trade-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .cat { font-size: 12px; font-weight: 600; color: var(--ring-c, var(--paper-dim)); letter-spacing: 0.04em; }
  .date { font-size: 12px; color: var(--paper-dim); margin-left: auto; }
  .post h2 {
    font-family: 'Gowun Batang', serif; font-size: 19px; font-weight: 700;
    line-height: 1.4; margin-bottom: 6px;
  }
  .post .body { font-size: 14.5px; color: var(--paper); white-space: pre-wrap; word-break: break-word; }
  .post.lockedcard { opacity: 0.65; }
  .post.lockedcard h2 { color: var(--paper-dim); font-size: 16px; }

  .post .body a { color: var(--river); text-decoration: underline; text-underline-offset: 3px; word-break: break-all; }

  /* 첨부: 사진 그리드 */
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
  .photos.single { grid-template-columns: 1fr; }
  .photos img { width: 100%; height: 100%; object-fit: cover; display: block; aspect-ratio: 4/3; background: var(--bark); border-radius: 10px; border: 1px solid var(--log-edge); transition: transform .18s ease; cursor: zoom-in; }
  .photos img.zoomed { transform: scale(1.5); cursor: zoom-out; position: relative; z-index: 5; }
  .photos.single img { aspect-ratio: auto; max-height: 260px; width: auto; max-width: 100%; margin: 0 auto; object-fit: contain; background: transparent; }

  /* 첨부: 파일 버튼 */
  .files { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .files a {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bark); border: 1px solid var(--log-edge); border-radius: 10px;
    padding: 9px 13px; font-size: 13px; color: var(--paper); text-decoration: none;
  }
  .files a:hover { border-color: var(--river); color: var(--river); }

  .empty { text-align: center; color: var(--paper-dim); padding: 60px 0 40px; font-size: 14px; }

  /* 액션바: 좋아요·댓글·공유 */
  .actbar { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--log-edge); }
  .actbar button {
    background: none; border: 1px solid var(--log-edge); color: var(--paper-dim);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .actbar button:hover { border-color: var(--river); color: var(--river); }
  .actbar button.liked { border-color: #d4826f; color: #d4826f; }

  /* 댓글 */
  .cmts { display: none; margin-top: 12px; }
  .cmts.show { display: block; }
  .cmt { padding: 9px 0; border-top: 1px dashed var(--log-edge); font-size: 13px; }
  .cmt .who { color: var(--river); font-weight: 600; font-size: 12.5px; margin-right: 8px; }
  .cmt .when { color: var(--paper-dim); font-size: 11px; }
  .cmt .del { background: none; border: none; color: var(--paper-dim); font-size: 11px; cursor: pointer; margin-left: 8px; font-family: inherit; }
  .cmt .del:hover { color: #d4826f; }
  .cmt p { margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .cmtform { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .cmtform input, .cmtform textarea {
    background: var(--bark); border: 1px solid var(--log-edge); border-radius: 10px;
    color: var(--paper); padding: 8px 11px; font-size: 13px; font-family: inherit;
  }
  .cmtform input { width: 90px; }
  .cmtform textarea { flex: 1; min-width: 200px; min-height: 38px; resize: vertical; }
  .cmtform input:focus-visible, .cmtform textarea:focus-visible { outline: none; border-color: var(--river); }
  .cmtform button {
    background: var(--river); border: none; color: var(--bark); font-weight: 600;
    border-radius: 10px; padding: 8px 14px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }

  .backlink { display: inline-block; margin-bottom: 18px; font-size: 13px; color: var(--river); text-decoration: none; border: 1px solid var(--log-edge); border-radius: 999px; padding: 6px 14px; }
  .backlink:hover { border-color: var(--river); }

  /* 우측 하단 방문자 배지 */
  .visits {
    position: fixed; right: 16px; bottom: 16px; z-index: 50;
    background: var(--log); border: 1px solid var(--log-edge);
    border-radius: 999px; padding: 8px 15px;
    font-size: 12px; color: var(--paper-dim); line-height: 1;
    display: flex; align-items: center; gap: 10px;
  }
  .visits b { color: var(--paper); font-weight: 600; }
  .visits .sep { color: var(--log-edge); }
  .visits .paw {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--paper); font-size: 12px; line-height: 1;
  }
  .empty .mark { font-size: 34px; display: block; margin-bottom: 10px; }

  footer {
    margin-top: 60px; text-align: center; font-size: 10.5px;
    letter-spacing: 0.18em; color: var(--paper-dim); text-transform: uppercase;
  }

  @media (prefers-reduced-motion: no-preference) {
    .post { animation: drift .35s ease both; }
    @keyframes drift { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
  /* ── 실전 기록 ── */
  .rl-head { margin-bottom: 14px; }
  .rl-head h2 { font-family: 'Gowun Batang', serif; font-size: 22px; margin-bottom: 4px; }
  .rl-basis { font-size: 12px; color: var(--paper-dim); }
  .rl-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  @media (max-width: 720px) { .rl-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .rl-kpi { background: var(--log); border: 1px solid var(--log-edge); border-radius: var(--radius); padding: 14px; }
  .rl-kpi .l { font-size: 12px; color: var(--paper-dim); }
  .rl-kpi .v { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .rl-kpi .s { font-size: 11px; color: var(--paper-dim); }
  .rl-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; align-items: start; }
  @media (max-width: 720px) { .rl-grid { grid-template-columns: 1fr; } }
  .rl-card { background: var(--log); border: 1px solid var(--log-edge); border-radius: var(--radius); margin-bottom: 12px; }
  .rl-grid .rl-card { margin-bottom: 0; }
  .rl-ch { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--log-edge); }
  .rl-ch b { font-size: 15px; } .rl-ch span { font-size: 11px; color: var(--paper-dim); }
  .rl-bd { padding: 12px 16px; }
  .rl-bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; margin-bottom: 10px; background: var(--bark); }
  .rl-srow { display: grid; grid-template-columns: 12px minmax(0, 1fr) 56px 64px; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; }
  .rl-sw { width: 10px; height: 10px; border-radius: 2px; }
  .rl-r { text-align: right; }
  .rl-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--log-edge); font-size: 13px; }
  .rl-row:last-child { border-bottom: none; }
  .rl-tag { font-size: 11px; color: var(--paper-dim); margin-left: 4px; }
  .rl-up { color: #e0675a; } .rl-dn { color: #7fa3d8; } .rl-mute { color: var(--paper-dim); }
  .rl-tr { background: var(--bark); border: 1px solid var(--log-edge); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .rl-tr:last-child { margin-bottom: 0; }
  .rl-trh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rl-trh b { font-size: 15px; } .rl-trh .ret { font-size: 15px; font-weight: 600; }
  .rl-meta { font-size: 12px; color: var(--paper-dim); margin: 2px 0 6px; }
  .rl-why { font-size: 13px; margin-top: 2px; } .rl-why span { color: var(--paper-dim); margin-right: 6px; }
  .rl-tl { display: block; margin: 4px 0; }
  .rl-foot { font-size: 11px; color: var(--paper-dim); line-height: 1.7; margin-top: 6px; }

  /* ATLAS 바로가기 */
  .atlasbtn { text-decoration: none; display: inline-block; color: var(--river); border-color: var(--river); font-weight: 600; letter-spacing: 0.06em; }
  .atlasbtn:hover, .atlasbtn:focus-visible { color: var(--bark); background: var(--river); border-color: var(--river); }
  @media (max-width: 560px) { .headrow { flex-wrap: wrap; } .lockbox { flex-wrap: wrap; } }

  /* ── AI 탭: 공개용 관제센터 · 협업 구조 ── */
  .ai-hub { margin-bottom: 26px; }
  .ai-hub .rl-ch b { font-family: 'Gowun Batang', serif; }
  .ai-intro h2 { font-family: 'Gowun Batang', serif; font-size: 22px; margin-bottom: 4px; }
  .ai-intro p { font-size: 12.5px; color: var(--paper-dim); margin-bottom: 14px; }
  .ai-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  @media (max-width: 620px) { .ai-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .ai-kpi { background: var(--log); border: 1px solid var(--log-edge); border-radius: 10px; padding: 8px 12px; }
  .ai-kpi .l { font-size: 11.5px; color: var(--paper-dim); }
  .ai-kpi .v { font-size: 19px; font-weight: 700; line-height: 1.3; }
  .ai-kpi .v small { font-size: 11.5px; font-weight: 500; color: var(--paper-dim); margin-left: 4px; }
  .ai-thead, .ai-proj { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.6fr) 58px 64px; gap: 14px; align-items: center; }
  .ai-thead { font-size: 11px; color: var(--paper-dim); padding-bottom: 6px; border-bottom: 1px solid var(--log-edge); }
  .ai-thead span:nth-child(n+3), .ai-proj > span:nth-child(n+3) { text-align: right; }
  .ai-proj { padding: 7px 0; font-size: 13.5px; }
  .ai-pname { color: var(--pc); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ai-pname i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--bark); background: var(--pc); border-radius: 5px; padding: 1px 5px; margin-right: 7px; vertical-align: 1px; }
  .ai-bar { height: 8px; border-radius: 999px; background: #3a2e22; overflow: hidden; }
  .ai-bar b { display: block; height: 100%; border-radius: 999px; background: var(--pc); }
  .ai-pct { font-weight: 600; font-variant-numeric: tabular-nums; }
  .ai-pct.na { color: var(--paper-dim); font-weight: 500; font-size: 12px; }
  .ai-st { font-size: 12px; white-space: nowrap; }
  .st-done { color: #7ec98f; } .st-doing { color: #7fb0ec; } .st-idea { color: #e2c15a; } .st-na { color: #d98a7a; }
  @media (max-width: 560px) { .ai-thead, .ai-proj { grid-template-columns: minmax(0, 1fr) 46px 54px; } .ai-thead span:nth-child(2), .ai-proj .ai-bar { display: none; } }
  .ai-flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  @media (max-width: 720px) { .ai-flow { grid-template-columns: 1fr; } }
  .ai-node { background: var(--bark); border: 1px solid var(--log-edge); border-left: 3px solid var(--nc); border-radius: 10px; padding: 11px 14px; }
  .ai-node.wide { grid-column: 1 / -1; }
  .ai-node .t { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; color: var(--nc); }
  .ai-node .t span { font-size: 10px; letter-spacing: 0.14em; color: var(--bark); background: var(--nc); border-radius: 5px; padding: 1px 6px; margin-right: 7px; font-weight: 700; }
  .ai-node ul { list-style: none; font-size: 12.5px; color: var(--paper-dim); }
  .ai-node li::before { content: '· '; color: var(--nc); }
  .ai-arrow { grid-column: 1 / -1; text-align: center; font-size: 11.5px; color: var(--paper-dim); letter-spacing: 0.08em; }
  .wf { max-width: 560px; margin: 4px auto 0; display: flex; flex-direction: column; align-items: stretch; }
  .wf-box { border: 1.5px solid var(--wc); background: var(--wb, rgba(255,255,255,0.03)); border-radius: 10px; padding: 11px 14px; text-align: center; font-size: 15px; color: var(--paper); }
  .wf-box b { font-weight: 600; }
  .wf-ai b { display: block; font-size: 18px; font-weight: 700; color: var(--wc); line-height: 1.3; }
  .wf-ai span { font-size: 14px; }
  .wf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .wf-line { width: 1.5px; height: 18px; background: #6b5c49; margin: 0 auto; }
  .wf-split, .wf-merge { position: relative; height: 26px; }
  .wf-split::before, .wf-merge::before { content: ''; position: absolute; left: 50%; width: 1.5px; height: 13px; background: #6b5c49; }
  .wf-split::before { top: 0; } .wf-merge::before { bottom: 0; }
  .wf-split::after, .wf-merge::after { content: ''; position: absolute; left: 25%; right: 25%; height: 13px; border: 1.5px solid #6b5c49; }
  .wf-split::after { bottom: 0; border-bottom: none; } .wf-merge::after { top: 0; border-top: none; }
  .wf-note { font-size: 11.5px; color: var(--paper-dim); margin-top: 12px; }
  @media (max-width: 560px) { .wf-row { gap: 16px; } .wf-box { font-size: 13.5px; } .wf-ai b { font-size: 16px; } .wf-ai span { font-size: 12.5px; } }
  .ai-rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; font-size: 12.5px; }
  @media (max-width: 560px) { .ai-rules { grid-template-columns: 1fr; } }
  .ai-rules div b { color: var(--rc, var(--violet)); font-weight: 600; margin-right: 6px; }
  /* AI 탭 넓은 화면 + 2단 · 세로 압축 */
  .ai-cols { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 12px; align-items: stretch; margin-bottom: 12px; }
  .ai-cols .rl-card { margin-bottom: 0; display: flex; flex-direction: column; }
  .ai-cols .rl-bd { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  @media (max-width: 900px) { .ai-cols { grid-template-columns: 1fr; } }
  .ai-hub .rl-ch { padding: 9px 14px; }
  .ai-hub .rl-bd { padding: 8px 14px 10px; }
  .ai-intro p { margin-bottom: 10px; }
  .ai-kpis { margin-bottom: 10px; }
  .ai-kpi { padding: 6px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .ai-kpi .v { font-size: 17px; }
  .ai-proj { padding: 3px 0; font-size: 13px; }
  .ai-thead { padding-bottom: 4px; margin-bottom: 2px; }
  .ai-bar { height: 7px; }
  .wf { max-width: 400px; width: 100%; }
  .wf-box { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .wf-ai b { font-size: 15px; }
  .wf-ai span { font-size: 12px; }
  .wf-row { gap: 28px; }
  .wf-line { height: 10px; }
  .wf-split, .wf-merge { height: 16px; }
  .wf-split::before, .wf-merge::before, .wf-split::after, .wf-merge::after { height: 8px; }
  .wf-note { margin-top: 6px; font-size: 11px; }
  .ai-postshead { font-size: 11px; letter-spacing: 0.18em; color: var(--paper-dim); text-transform: uppercase; margin: 22px 0 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="headrow">
      <div>
        <div class="eyebrow">BEAVER'S ARCHIVE — 주식 · 부동산 · AI 기록</div>
        <h1><a href="/" class="homebeaver" title="전체 글 보기">🦫</a> 비버의 아카이브</h1>
        <p class="tagline">거창한 계획 대신, 매일 하나씩 물어다 놓습니다.</p>
        <p class="byline"><span class="role">주인장</span>비로(BEERO)</p>
      </div>
      <div class="lockbox">
        <a class="writebtn atlasbtn" href="https://atlas-market-kis.pages.dev/" target="_blank" rel="noopener noreferrer" title="ATLAS — 글로벌 섹터 로테이션 대시보드 (새 창)">ATLAS ↗</a>
        <button class="writebtn" id="backupBtn" type="button" title="전체 글을 JSON 파일로 저장">💾</button>
        <button class="writebtn" id="writeBtn" type="button">✏️ 글쓰기</button>

          <input type="password" id="keyInput" placeholder="비밀번호" autocomplete="off">

  <nav class="filters" id="filters" aria-label="분류 필터">
    <button data-f="전체" class="active" type="button">전체</button>

  <section class="editor" id="editor">

    <div class="row">
      <input type="text" id="wTitle" placeholder="제목" maxlength="200">
    </div>
    <div class="row">
      <textarea id="wBody" placeholder="본문 — 사진 첨부 후 [본문에 넣기]를 누르면 커서 위치에 [사진1]이 들어갑니다. 크기 조절은 [사진1:소] [사진1:중] [사진1:대] 처럼 뒤에 붙이면 됩니다. 링크는 자동으로 클릭 가능해집니다."></textarea>
    </div>
    <div class="row" style="align-items:center;">
      <select id="wCat">
        <option value="스터디">스터디</option>
        <option value="시황">시황</option>
        <option value="생각" selected>생각</option>
        <option value="매매일지">매매일지</option>
        <option value="AI">AI</option>
        <option value="콜">콜</option>
      </select>
      <label class="chk"><input type="checkbox" id="wPriv"> 비공개 🔒</label>
      <label class="filelabel">📷 사진·파일 첨부<input type="file" id="wFiles" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.hwp,.txt,.zip" style="display:none;"></label>
    </div>
    <div class="filelist" id="wFileList"></div>

      <span class="status" id="wStatus"></span>
      <button class="cancel" id="wCancel" type="button">닫기</button>

  <main id="list">
    <div class="empty"><span class="mark">🪵</span>불러오는 중…</div>

  <footer>Beaver's Archive · Written via Telegram · One log a day</footer>

<div class="visits" id="visits" hidden><span class="paw">🐾</span> 오늘 <b id="vToday">0</b><span class="sep">|</span>전체 <b id="vTotal">0</b></div>

<script>
  let posts = [];
  let filter = '전체';
  let unlocked = false;

  const list = document.getElementById('list');
  const lockBtn = document.getElementById('lockBtn');
  const keyForm = document.getElementById('keyForm');
  const keyInput = document.getElementById('keyInput');

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  }
  function esc(s) {
    return (s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // 이스케이프 후 URL만 클릭 가능한 링크로 변환
  function linkify(s) {
    return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function fileUrl(fid, name) {
    const key = sessionStorage.getItem('beaverkey') || '';
    let u = '/api/file?fid=' + encodeURIComponent(fid);
    if (key) u += '&key=' + encodeURIComponent(key);
    if (name) u += '&name=' + encodeURIComponent(name);
    return u;
  }
  // 본문을 [사진N] 자리표 기준으로 쪼개서 글-사진-글 순서로 렌더링
  // 크기 옵션: [사진1:소]=160px [사진1]=[사진1:중]=260px [사진1:대]=400px
  function renderTrade(p) {
    const body = String(p.body || '');
    const m = body.match(/^\[체결\] (매수|매도) · (.+?) · ([\d,]+)주 · ([^·\n]+?)(?: · 금액 ([^\n]+))?$/m);
    if (!m) return null;
    const side = m[1], symRaw = m[2].trim(), qty = m[3], px = m[4].trim(), amt = m[5] ? m[5].trim() : null;
    const cm = symRaw.match(/^(.*?)\s*\((\d{6})\)$/);
    const sym = cm ? cm[1] : symRaw, code = cm ? cm[2] : '';
    const get = (tag) => { const r = body.match(new RegExp('^\\[' + tag + '\\]\\s*([\\s\\S]*?)(?=\\n\\[|\\n---|$)', 'm')); return r ? r[1].trim() : ''; };
    const when = get('기록시각'), reason = get('사유'), memo = get('추가 메모'), link = get('매도 연결'), prev = get('직전 매수 사유');
    const raw = (body.split(/\n---\n/)[1] || '').replace(/^\[원문\]\s*/, '');
    const mock = /\[구분\] 모의/.test(body) || /^\[모의\]/.test(p.title || '');
    const n = (s) => Number(String(s).replace(/[^\d.]/g, ''));
    const isUsd = /^\$/.test(px);
    const amount = amt || (n(qty) && n(px) ? (isUsd ? '$' + (n(qty) * n(px)).toFixed(2) : (n(qty) * n(px)).toLocaleString('ko-KR') + '원') : '-');
    let linkHtml = '';
    if (link) {
      const rm = link.match(/수익률 ([+-]?[\d.]+)%/);
      const cls = rm && Number(rm[1]) < 0 ? 'down' : 'up';
      linkHtml = '<div class="trade-link">' + esc(link).replace(/수익률 ([+-]?[\d.]+%)/, '수익률 <span class="' + cls + '">$1</span>') + '</div>';
    }
    const waiting = !reason || reason.includes('답장 대기');
    return '<div class="trade">' +
      '<div class="trade-head"><span class="trade-side ' + (side === '매수' ? 'buy' : 'sell') + '">' + side + '</span>' +
        '<span class="trade-sym">' + esc(sym) + '</span>' + (code ? '<span class="trade-code">' + code + '</span>' : '') +
        (mock ? '<span class="trade-mock">모의</span>' : '') + '</div>' +
      '<div class="trade-stats">' +
        '<div class="trade-stat"><div class="k">수량</div><div class="v">' + esc(qty) + '주</div></div>' +
        '<div class="trade-stat"><div class="k">체결가</div><div class="v">' + esc(px) + '</div></div>' +
        '<div class="trade-stat"><div class="k">금액</div><div class="v">' + esc(amount) + '</div></div>' +
      '</div>' + linkHtml +
      (prev ? '<div class="trade-reason prev"><div class="k">직전 매수 사유</div><div class="v">' + esc(prev) + '</div></div>' : '') +
      '<div class="trade-reason' + (waiting ? ' is-empty' : '') + '"><div class="k">' + side + ' 사유</div><div class="v">' +
        (waiting ? '아직 사유가 없습니다 · 텔레그램 알림에 답장하면 채워집니다' : esc(reason)) + '</div></div>' +
      (memo ? '<div class="trade-reason prev"><div class="k">추가 메모</div><div class="v">' + esc(memo) + '</div></div>' : '') +
      '<div class="trade-foot"><span>' + esc(when) + '</span>' +
        (raw ? '<details class="trade-raw"><summary>원문 문자 보기 ▾</summary><pre>' + esc(raw) + '</pre></details>' : '<span></span>') +
      '</div></div>';
  }

  function renderBodyWithInline(body, atts) {
    const photos = (atts || []).filter((a) => a.type === 'photo');
    const used = new Set();
    const SIZE = { '소': 160, '중': 260, '대': 400 };
    let html = '';
    const parts = (body || '').split(/(\[사진\d+(?::(?:소|중|대))?\])/);
    for (const part of parts) {
      if (part === undefined) continue;
      const m = part.match(/^\[사진(\d+)(?::(소|중|대))?\]$/);
      if (m) {
        const idx = parseInt(m[1], 10) - 1;
        const h = SIZE[m[2] || '중'];
        if (photos[idx]) {
          used.add(idx);
          html += `<div class="photos single" style="margin:12px 0;"><img src="${fileUrl(photos[idx].file_id)}" alt="본문 사진" loading="lazy" style="max-height:${h}px;"></div>`;
        }
      } else if (part.trim()) {
        html += `<div class="body" style="margin-top:6px;">${linkify(part.trim())}</div>`;
      }
    }
    const rest = photos.filter((_, i) => !used.has(i));
    const docs = (atts || []).filter((a) => a.type === 'document');
    html += renderAttachments([...rest, ...docs]);
    return html;
  }

  function renderAttachments(atts) {
    if (!atts || !atts.length) return '';
    const photos = atts.filter((a) => a.type === 'photo');
    const docs = atts.filter((a) => a.type === 'document');
    let html = '';
    if (photos.length) {
      html += `<div class="photos${photos.length === 1 ? ' single' : ''}">` +
        photos.map((p) => `<img src="${fileUrl(p.file_id)}" alt="첨부 사진" loading="lazy">`).join('') +
        '</div>';
    }
    if (docs.length) {
      html += '<div class="files">' +
        docs.map((d) => `<a href="${fileUrl(d.file_id, d.file_name)}">📎 ${esc(d.file_name || '파일')}</a>`).join('') +
        '</div>';
    }
    return html;
  }

  function fmtDateTime(iso) {
    const d = new Date(iso);
    return fmtDate(iso) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  const liked = new Set(JSON.parse(localStorage.getItem('beaverlikes') || '[]'));
  const permalinkId = new URLSearchParams(location.search).get('post');

  // ── 방명록 ──
  let gb = null;
  async function loadGuestbook() {
    try {
      const r = await fetch('/api/guestbook');
      gb = (await r.json()).entries || [];
    } catch { gb = []; }
    renderGuestbook();
  }
  function renderGuestbook() {
    if (filter !== '방명록') return;
    const entries = gb.map((g) => `
      <div class="cmt">
        <span class="who">${esc(g.nickname)}</span><span class="when">${fmtDateTime(g.created_at)}</span>
        ${unlocked ? `<button type="button" class="del gbdel" data-gid="${g.id}">삭제</button>` : ''}
        <p>${esc(g.body)}</p>
      </div>`).join('');
    list.innerHTML = `
      <article class="post">
        <div class="post-meta"><span class="cat" style="color:var(--river);">📖 방명록</span></div>
        <p class="body" style="color:var(--paper-dim);font-size:13px;">잘 보고 갑니다, 궁금한 점, 응원 한마디 — 자유롭게 남겨주세요.</p>
        <div class="cmtform" style="margin-top:12px;">
          <input type="text" class="gnick" placeholder="닉네임" maxlength="12" style="width:100px;">
          <textarea class="gbody" placeholder="내용 (500자 이내)" maxlength="500"></textarea>
          <button type="button" class="gbgo">남기기</button>
        </div>
        <div id="gbmsg" style="font-size:12.5px;color:var(--paper-dim);margin-top:6px;"></div>
      </article>
      ${entries || '<div class="empty"><span class="mark">📖</span>첫 방명록의 주인공이 되어주세요.</div>'}`;
  }

  // ── 실전 기록 (공개 수익률 · 수량·금액 비공개) ──
  const RL_PAL = ['#c9975a', '#6fb3aa', '#c97b63', '#8fa6c9', '#a493d1', '#8ca86b', '#d6b98c', '#a9977d'];
  const rlCls = (v) => (v == null || !isFinite(v) ? 'rl-mute' : v > 0 ? 'rl-up' : v < 0 ? 'rl-dn' : '');
  const rlPct = (v, d = 2) => (v == null || !isFinite(v) ? '-' : (v > 0 ? '+' : '') + v.toFixed(d) + '%');
  const rlMd = (s) => (s ? s.slice(5).replace('-', '/') : '');
  const RL_CUR = { KRW: '원', JPY: '엔', HKD: '홍콩달러', CNY: '위안' };
  const RL_MKT = { KR: '', US: '미국', JP: '일본', HK: '홍콩', CN: '중국' };
  const rlMoney = (n, c) => (n == null ? '-' : c === 'USD' ? '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 })
    : Number(n).toLocaleString('ko-KR', { maximumFractionDigits: c === 'KRW' ? 0 : 2 }) + (RL_CUR[c] || '원'));
  function rlTimeline(points, cur) {
    if (points.length < 2) return '';
    const W = 300, H = 52, P = 8;
    const t = points.map((p) => new Date(p.date).getTime()), v = points.map((p) => p.price);
    const t0 = Math.min(...t), t1 = Math.max(...t), v0 = Math.min(...v), v1 = Math.max(...v);
    const x = (i) => P + (t1 > t0 ? (t[i] - t0) / (t1 - t0) : i / (points.length - 1)) * (W - 2 * P);
    const y = (i) => H - P - (v1 > v0 ? (v[i] - v0) / (v1 - v0) : 0.5) * (H - 2 * P);
    const line = points.map((_, i) => x(i).toFixed(1) + ',' + y(i).toFixed(1)).join(' ');
    const dots = points.map((p, i) => p.type === 'buy'
      ? `<polygon points="${x(i)},${y(i) - 6} ${x(i) - 5},${y(i) + 3} ${x(i) + 5},${y(i) + 3}" fill="#e0675a"><title>매수 ${rlMd(p.date)} ${rlMoney(p.price, cur)}</title></polygon>`
      : `<polygon points="${x(i)},${y(i) + 6} ${x(i) - 5},${y(i) - 3} ${x(i) + 5},${y(i) - 3}" fill="#7fa3d8"><title>매도 ${rlMd(p.date)} ${rlMoney(p.price, cur)}</title></polygon>`).join('');
    return `<svg class="rl-tl" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="매수 매도 타점"><polyline points="${line}" fill="none" stroke="#5a4733" stroke-width="1.2" stroke-dasharray="3 3"/>${dots}</svg>`;
  }
  let rlData = null;
  async function renderReal() {
    if (!rlData) {
      list.innerHTML = '<div class="empty"><span class="mark">📈</span>실전 기록 불러오는 중…</div>';
      try { const r = await fetch('/api/performance'); rlData = await r.json(); if (!rlData.ok) throw 0; }
      catch { rlData = null; if (filter === '실전기록') list.innerHTML = '<div class="empty"><span class="mark">📈</span>실전 기록을 불러오지 못했습니다.</div>'; return; }
    }
    if (filter !== '실전기록') return;
    const d = rlData, s = d.summary;
    const open = d.open || [], closed = d.closed || [];
    const evalOf = (x) => { const o = open.find((y) => (y.code || y.name) === (x.code || x.name)); return o && o.evalPct != null ? o : null; };
    const unreal = (x) => { const o = evalOf(x); return o && x.openCostSharePct ? x.openCostSharePct * o.evalPct / 100 : 0; };
    const stocks = (d.stocks || []).map((x) => ({ ...x, totalPct: x.weightPct ? ((x.realizedPnlSharePct || 0) + unreal(x)) / x.weightPct * 100 : null }));
    const total = stocks.reduce((a, x) => a + (x.realizedPnlSharePct || 0) + unreal(x), 0);
    const missing = open.filter((o) => o.evalPct == null).length;
    const wins = Math.round((s.winRatePct || 0) * s.closedTrades / 100);
    const secs = {};
    stocks.forEach((x) => { const g = secs[x.sector] || (secs[x.sector] = { sector: x.sector, w: 0, pnl: 0, n: 0 }); g.w += x.weightPct || 0; g.pnl += (x.realizedPnlSharePct || 0) + unreal(x); g.n++; });
    const secList = Object.values(secs).sort((a, b) => b.w - a.w);
    const kpi = (l, v, sub, c) => `<div class="rl-kpi"><div class="l">${l}</div><div class="v ${c || ''}">${v}</div><div class="s">${sub}</div></div>`;
    list.innerHTML = `
      <div class="rl-head"><h2>실전 매매 기록</h2><div class="rl-basis">실제 계좌 체결 기준 · 세전·수수료 전 · 수량과 금액은 공개하지 않습니다</div></div>
      <div class="rl-kpis">
        ${kpi('실현 누적 수익률', rlPct(s.cumulativeReturnPct), '금액 가중', rlCls(s.cumulativeReturnPct))}
        ${kpi('투입원가 대비 총손익', stocks.length ? rlPct(total) : '-', missing ? `보유 ${missing}종목 시세 미반영` : '실현 + 보유 평가', rlCls(total))}
        ${kpi('승률', s.winRatePct == null ? '-' : Math.round(s.winRatePct) + '%', s.closedTrades ? `${wins}승 ${s.closedTrades - wins}패` : '실현 거래 없음')}
        ${kpi('평균 보유', s.avgHoldDays == null ? '-' : Math.round(s.avgHoldDays) + '일', s.avgReturnPct == null ? '' : '거래당 평균 ' + rlPct(s.avgReturnPct))}
      </div>
      <div class="rl-grid">
        <div class="rl-card"><div class="rl-ch"><b>섹터별</b><span>투입원가 기준 비중</span></div><div class="rl-bd">${secList.length
          ? `<div class="rl-bar">${secList.map((g, i) => `<div style="width:${g.w}%;background:${RL_PAL[i % RL_PAL.length]}" title="${esc(g.sector)} ${g.w.toFixed(1)}%"></div>`).join('')}</div>` +
            secList.map((g, i) => { const r = g.w ? g.pnl / g.w * 100 : null; return `<div class="rl-srow"><span class="rl-sw" style="background:${RL_PAL[i % RL_PAL.length]}"></span><span>${esc(g.sector)}<span class="rl-tag">${g.n}종목</span></span><span class="rl-r rl-mute">${g.w.toFixed(1)}%</span><span class="rl-r ${rlCls(r)}">${rlPct(r, 1)}</span></div>`; }).join('')
          : '<div class="rl-mute">아직 기록이 없습니다</div>'}</div></div>
        <div class="rl-card"><div class="rl-ch"><b>종목별</b><span>비중 · 손익률</span></div><div class="rl-bd">${stocks.length
          ? stocks.map((x) => `<div class="rl-row"><span>${esc(x.name)}<span class="rl-tag">${esc(x.sector)}${RL_MKT[x.market] ? ' · ' + RL_MKT[x.market] : ''} · ${x.buys + x.sells}회${x.holding ? ' · 보유' : ''}</span></span><span class="rl-r"><span class="rl-mute" style="margin-right:10px">${(x.weightPct || 0).toFixed(1)}%</span><b class="${rlCls(x.totalPct)}">${rlPct(x.totalPct, 1)}</b></span></div>`).join('')
          : '<div class="rl-mute">아직 기록이 없습니다</div>'}</div></div>
      </div>
      <div class="rl-card"><div class="rl-ch"><b>보유 중</b><span>${open.length ? open.length + '종목' : ''}</span></div><div class="rl-bd">${open.length ? open.map((o) => `
        <div class="rl-tr"><div class="rl-trh"><b>${esc(o.name)}<span class="rl-tag">${esc(o.sector || '')}${RL_MKT[o.market] ? ' · ' + RL_MKT[o.market] : ''}</span></b><span class="ret ${o.evalPct != null ? rlCls(o.evalPct) : 'rl-mute'}">${o.evalPct != null ? rlPct(o.evalPct) : '시세 미지원'}<span class="rl-tag">평가</span></span></div>
          <div class="rl-meta">${rlMd(o.buyDate)} 첫 매수 · 평균 타점 ${rlMoney(o.avgEntry, o.currency)}${o.livePrice ? ' · 현재가 ' + rlMoney(o.livePrice, o.currency) : ''}${(o.entries || []).length > 1 ? ' · 분할매수 ' + o.entries.length + '회' : ''}</div>
          ${rlTimeline((o.entries || []).map((p) => ({ ...p, type: 'buy' })), o.currency)}
          ${(o.reasons || []).map((r) => `<div class="rl-why"><span>매수 사유</span>${esc(r)}</div>`).join('')}</div>`).join('') : '<div class="rl-mute">보유 중인 종목이 없습니다</div>'}</div></div>
      <div class="rl-card"><div class="rl-ch"><b>실현 거래</b><span>${closed.length ? closed.length + '건' : ''}</span></div><div class="rl-bd">${closed.length ? closed.map((c) => `
        <div class="rl-tr"><div class="rl-trh"><b>${esc(c.name)}<span class="rl-tag">${RL_MKT[c.market] || ''}${c.partial ? ' · 일부 매도' : ''}</span></b><span class="ret ${rlCls(c.returnPct)}">${rlPct(c.returnPct)}</span></div>
          <div class="rl-meta">${rlMd(c.buyDate)} 매수 ${rlMoney(c.avgEntry, c.currency)} → ${rlMd(c.sellDate)} 매도 ${rlMoney(c.sellPrice, c.currency)} · ${c.holdDays}일${c.currency !== 'KRW' ? ' · 현지통화 기준' : ''}</div>
          ${rlTimeline((c.entries || []).map((p) => ({ ...p, type: 'buy' })).concat([{ date: c.sellDate, price: c.sellPrice, type: 'sell' }]), c.currency)}
          ${(c.buyReasons || []).map((r) => `<div class="rl-why"><span>매수 사유</span>${esc(r)}</div>`).join('')}
          ${c.sellReason ? `<div class="rl-why"><span>매도 사유</span>${esc(c.sellReason)}</div>` : ''}</div>`).join('') : '<div class="rl-mute">아직 실현한 거래가 없습니다</div>'}</div></div>
      <div class="rl-foot">기준: ${esc(d.basis)}<br>비중은 누적 투입원가 기준이며 외화 종목은 매수일 기준환율로 환산한 추정치입니다. 섹터 분류: ATLAS.<br>보유 종목 평가는 국내·미국 시세로 계산하며, 그 외 시장은 평가에서 빠집니다. 갱신 ${new Date(d.asof).toLocaleString('ko-KR')}</div>`;
  }

  // ── AI 탭: 공개용 관제센터 (익명화 정적 데이터 · 내부 원본과 연결되지 않음) ──
  // 실제 프로젝트명·상세 작업·내부 링크는 넣지 않는다. 수동 검토 후 갱신.
  const AI_PUBLIC = {
    asof: '2026-11-27',
    // pct: 잠정 완성도(AI 평가, 실측 아님) · null = 미평가
    projects: [
      { id: 'H', area: 'AI 협업 인프라', pct: 93, st: 'done', c: '#c9a07a' },
      { id: 'J', area: '매매 알림 자동화', pct: 80, st: 'done', c: '#f0a15e' },
      { id: 'B', area: '시장 데이터 대시보드', pct: 75, st: 'doing', c: '#6aa5f0' },
      { id: 'C', area: '뉴스 브리핑 자동화', pct: 70, st: 'doing', c: '#e6c548' },
      { id: 'E', area: '생활 기록 웹앱', pct: 60, st: 'doing', c: '#e886b6' },
      { id: 'D', area: '모의투자 웹앱', pct: 55, st: 'doing', c: '#b195e8' },
      { id: 'A', area: '개인 기록·포트폴리오 사이트', pct: 53, st: 'doing', c: '#62c08f' },
      { id: 'G', area: '업무 문서 자동화', pct: 38, st: 'doing', c: '#b8b8b8' },
      { id: 'I', area: '소규모 웹서비스', pct: 10, st: 'idea', c: '#f09a62' },
      { id: 'F', area: '공시 알림 봇', pct: null, st: 'na', c: '#e07a6e' },
    ],
  };
  function aiHub() {
    const P = AI_PUBLIC.projects, N = P.length;
    const cnt = (f) => P.filter(f).length;
    const done = cnt((p) => p.st === 'done'), doing = cnt((p) => p.st === 'doing'), rest = N - done - doing;
    const pc = (k) => Math.round(k / N * 100) + '%';
    const ST = { done: ['완료', 'st-done'], doing: ['진행 중', 'st-doing'], idea: ['구상 중', 'st-idea'], na: ['미확인', 'st-na'] };
    const kpi = (l, v, sub, color) => `<div class="ai-kpi"><div class="l">${l}</div><div class="v" style="color:${color}">${v}${sub ? `<small>${sub}</small>` : ''}</div></div>`;
    const rows = P.map((p) => `
      <div class="ai-proj" style="--pc:${p.c}">
        <span class="ai-pname"><i>${esc(p.id)}</i>${esc(p.area)}</span>
        <span class="ai-bar"><b style="width:${p.pct || 0}%"></b></span>
        <span class="ai-pct${p.pct == null ? ' na' : ''}">${p.pct == null ? '미평가' : p.pct + '%'}</span>
        <span class="ai-st ${ST[p.st][1]}">${ST[p.st][0]}</span>
      </div>`).join('');
    return `
      <section class="ai-hub" aria-label="AI 프로젝트 관제센터">
        <div class="ai-intro"><h2>AI 프로젝트 관제센터</h2><p>ChatGPT와 Claude를 함께 써서 만드는 개인 프로젝트 현황입니다 · 프로젝트는 익명 코드로 표시합니다</p></div>
        <div class="ai-kpis">
          ${kpi('전체 프로젝트', N + '개', '', 'var(--paper)')}
          ${kpi('진행 중', pc(doing), doing + '개', '#7fb0ec')}
          ${kpi('완료', pc(done), done + '개', '#7ec98f')}
          ${kpi('구상·미확인', pc(rest), rest + '개', '#e2c15a')}
        </div>
        <div class="ai-cols">
        <div class="rl-card"><div class="rl-ch"><b>프로젝트별 완성도</b><span>잠정 · AI 평가</span></div><div class="rl-bd">
          <div class="ai-thead"><span>프로젝트</span><span></span><span>완성도</span><span>상태</span></div>${rows}</div></div>
        <div class="rl-card"><div class="rl-ch"><b>My AI Workflow</b><span>두 AI가 하나의 기록을 공유</span></div><div class="rl-bd">
          <div class="wf">
            <div class="wf-box" style="--wc:#8a7c69"><b>USER</b> · 기획 및 의사결정</div>
            <div class="wf-split"></div>
            <div class="wf-row">
              <div class="wf-box wf-ai" style="--wc:#62c08f;--wb:rgba(98,192,143,0.10)"><b>ChatGPT</b><span>기획 · 분석 · 설계</span></div>
              <div class="wf-box wf-ai" style="--wc:#f0a15e;--wb:rgba(240,161,94,0.10)"><b>Claude</b><span>개발 · 구현 · 검증</span></div>
            </div>
            <div class="wf-merge"></div>
            <div class="wf-box" style="--wc:#8a7c69"><b>Shared Memory</b> · 공통 지식 및 업무 상태 관리</div>
            <div class="wf-line"></div>
            <div class="wf-box" style="--wc:#6aa5f0;--wb:rgba(106,165,240,0.08)"><b>Project Control Center</b> · 통합 프로젝트 관리</div>
          </div>
          <div class="wf-note">두 AI의 역할은 작업에 따라 유연하게 변경</div>
        </div></div>
        </div>
        <div class="rl-foot">기준일 ${AI_PUBLIC.asof} · 수동 갱신 스냅숏입니다. 완성도는 AI가 기록을 근거로 매긴 잠정 평가이며 실측 진척률이 아닙니다. 프로젝트 코드는 실제 명칭과 연결 정보를 공개하지 않습니다.</div>
        <div class="ai-postshead">AI 작업 기록</div>
      </section>`;
  }

  function render() {
    if (filter === '실전기록') { renderReal(); return; }
    if (filter === '방명록') {
      if (gb === null) {
        list.innerHTML = '<div class="empty"><span class="mark">📖</span>방명록 여는 중…</div>';
        loadGuestbook();
      } else {
        renderGuestbook();
      }
      return;
    }
    let shown = posts.filter((p) => filter === '전체' || p.category === filter);
    let back = '';
    if (permalinkId) {
      shown = posts.filter((p) => String(p.id) === String(permalinkId));
      back = `<a class="backlink" href="${location.pathname}">← 전체 글 보기</a>`;
      if (!shown.length) {
        list.innerHTML = back + '<div class="empty"><span class="mark">🪵</span>글을 찾을 수 없습니다.</div>';
        return;
      }
    }
    const hub = (filter === 'AI' && !permalinkId) ? aiHub() : '';
    if (!shown.length) {
      list.innerHTML = hub + '<div class="empty"><span class="mark">🪵</span>아직 물어다 놓은 통나무가 없습니다.</div>';
      return;
    }
    list.innerHTML = back + hub + shown.map((p) => {
      if (p.locked) {
        return `<article class="post lockedcard" data-cat="${esc(p.category)}">
          <div class="post-meta"><span class="ring"></span><span class="cat">${esc(p.category)}</span><span class="date">${fmtDate(p.posted_at)}</span></div>
          <h2>비공개 글 🔒</h2>
        </article>`;
      }
      const cms = p.comments || [];
      const isLiked = liked.has(p.id);
      return `<article class="post" data-cat="${esc(p.category)}" data-id="${p.id}">
        <div class="post-meta"><span class="ring"></span><span class="cat">${esc(p.category)}${p.is_private ? ' 🔒' : ''}</span><span class="date">${fmtDate(p.posted_at)}</span></div>
        ${(() => { const tr = p.category === '매매일지' ? renderTrade(p) : null; return tr || `<h2>${esc(p.title)}</h2>
        ${renderBodyWithInline(p.body, p.attachments)}`; })()}
        <div class="actbar">
          <button type="button" class="likebtn${isLiked ? ' liked' : ''}" data-id="${p.id}">${isLiked ? '❤️' : '🤍'} <span class="likeN">${p.likes || 0}</span></button>
          <button type="button" class="cmtbtn" data-id="${p.id}">💬 ${cms.length}</button>
          <button type="button" class="sharebtn" data-id="${p.id}" data-private="${p.is_private ? 1 : 0}">🔗 공유</button>
          ${unlocked ? `<button type="button" class="editbtn" data-id="${p.id}">✏️ 수정</button><button type="button" class="delpost" data-id="${p.id}">🗑 삭제</button>` : ''}
        </div>
        <div class="cmts${permalinkId ? ' show' : ''}" id="cmts-${p.id}">
          ${cms.map((c) => `<div class="cmt"><span class="who">${esc(c.nickname)}</span><span class="when">${fmtDateTime(c.created_at)}</span>${unlocked ? `<button type="button" class="del" data-cid="${c.id}">삭제</button>` : ''}<p>${esc(c.body)}</p></div>`).join('')}
          <div class="cmtform">
            <input type="text" placeholder="닉네임" maxlength="20" class="cnick">
            <textarea placeholder="댓글을 남겨주세요" maxlength="1000" class="cbody"></textarea>
            <button type="button" class="cgo" data-id="${p.id}">등록</button>
          </div>
        </div>
      </article>`;
    }).join('');
  }

  async function load() {
    const key = sessionStorage.getItem('beaverkey') || '';
    try {
      const r = await fetch('/api/posts' + (key ? '?key=' + encodeURIComponent(key) : ''));
      const data = await r.json();
      posts = data.posts || [];
      unlocked = Boolean(data.unlocked);
      lockBtn.textContent = unlocked ? '🚪 로그아웃' : '🔑 로그인';
      lockBtn.classList.toggle('on', unlocked);
      document.getElementById('writeBtn').hidden = !unlocked;
      document.getElementById('backupBtn').hidden = !unlocked;
      if (!unlocked && key) sessionStorage.removeItem('beaverkey');
      render();
    } catch (e) {
      list.innerHTML = '<div class="empty"><span class="mark">🪵</span>불러오기에 실패했습니다. 새로고침 해주세요.</div>';
    }
  }

  lockBtn.addEventListener('click', () => {
    if (unlocked) {
      sessionStorage.removeItem('beaverkey');
      load();
      return;
    }
    keyForm.classList.toggle('show');
    if (keyForm.classList.contains('show')) keyInput.focus();
  });
  document.getElementById('keyGo').addEventListener('click', submitKey);
  keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitKey(); });
  function submitKey() {
    const v = keyInput.value.trim();
    if (!v) return;
    sessionStorage.setItem('beaverkey', v);
    keyForm.classList.remove('show');
    keyInput.value = '';
    load();
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('.filters button').forEach((x) => x.classList.toggle('active', x === b));
    render();
  });

  // ── 글쓰기 에디터 ──
  const editor = document.getElementById('editor');
  const wFiles = document.getElementById('wFiles');
  const wFileList = document.getElementById('wFileList');
  const wStatus = document.getElementById('wStatus');
  const wCat = document.getElementById('wCat');
  const wPriv = document.getElementById('wPriv');
  let pending = [];
  let editingId = null;

  function resetEditor() {
    editingId = null;
    wTitleEl.value = '';
    wBodyEl.value = '';
    wCat.value = '생각';
    wPriv.checked = false;
    wFiles.value = ''; pending = []; wFileList.textContent = '';
    wStatus.textContent = '';
    document.getElementById('wGo').textContent = '발행';
    document.querySelector('#editor h3').textContent = '새 통나무 🪵';
  }

  document.getElementById('writeBtn').addEventListener('click', () => {
    let key = sessionStorage.getItem('beaverkey') || '';
    if (!key) {
      key = prompt('주인장 비밀번호를 입력하세요');
      if (!key) return;
      sessionStorage.setItem('beaverkey', key.trim());
      load();
    }
    if (!editor.classList.contains('show') && editingId) resetEditor();
    editor.classList.toggle('show');
    if (editor.classList.contains('show')) { restoreDraft(); document.getElementById('wTitle').focus(); }
  });
  document.getElementById('wCancel').addEventListener('click', () => { resetEditor(); editor.classList.remove('show'); });

  wCat.addEventListener('change', () => { wPriv.checked = wCat.value === '콜' || wCat.value === '매매일지'; queueDraft(); });

  // ── 임시저장 (자동) ──
  const DRAFT_KEY = 'beaverdraft';
  const wTitleEl = document.getElementById('wTitle');
  const wBodyEl = document.getElementById('wBody');
  let draftTimer = null;
  function saveDraft() {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      t: wTitleEl.value, b: wBodyEl.value, c: wCat.value, p: wPriv.checked, at: Date.now(),
    }));
    wStatus.textContent = '💾 임시저장됨';
  }
  function queueDraft() {
    if (editingId) return;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 700);
  }
  wTitleEl.addEventListener('input', queueDraft);
  wBodyEl.addEventListener('input', queueDraft);
  wPriv.addEventListener('change', queueDraft);
  function restoreDraft() {
    if (editingId) return;
    try {
      const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if (!d || (!d.t && !d.b)) return;
      if (wTitleEl.value.trim() || wBodyEl.value.trim()) return;
      wTitleEl.value = d.t || '';
      wBodyEl.value = d.b || '';
      if (d.c) wCat.value = d.c;
      wPriv.checked = Boolean(d.p);
      wStatus.textContent = '💾 임시저장 글을 불러왔어요 (사진은 다시 첨부해주세요)';
    } catch {}
  }

  document.getElementById('backupBtn').addEventListener('click', () => {
    let key = sessionStorage.getItem('beaverkey') || '';
    if (!key) {
      key = (prompt('주인장 비밀번호를 입력하세요') || '').trim();
      if (!key) return;
      sessionStorage.setItem('beaverkey', key);
    }
    window.location.href = '/api/backup?key=' + encodeURIComponent(key);
  });

  // 사진은 발행 전에 브라우저에서 리사이즈(최대 1600px, JPEG)해서 용량을 줄인다
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        let { width, height } = img;
        if (width > MAX || height > MAX) {
          const r = Math.min(MAX / width, MAX / height);
          width = Math.round(width * r); height = Math.round(height * r);
        }
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        c.toBlob((blob) => blob ? resolve(blob) : reject(new Error('compress failed')), 'image/jpeg', 0.85);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  function toBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  function rebuildFileList() {
    let n = 0;
    const rows = pending.map((p, i) => {
      if (p.isPhoto) {
        n += 1;
        return `<span>📷 ${esc(p.origName)} <button type="button" class="inspin" data-n="${n}">↳ 본문에 넣기 [사진${n}]</button> <button type="button" class="rmatt" data-i="${i}">✕</button></span>`;
      }
      return `<span>📎 ${esc(p.origName)} <button type="button" class="rmatt" data-i="${i}">✕</button></span>`;
    });
    wFileList.innerHTML = rows.join('<br>');
  }

  wFiles.addEventListener('change', async () => {
    const picked = Array.from(wFiles.files);
    wFiles.value = '';
    for (const f of picked) {
      if (pending.length >= 10) { wStatus.textContent = '첨부는 최대 10개까지입니다'; break; }
      if (f.type.startsWith('image/')) {
        const blob = await compressImage(f).catch(() => f);
        pending.push({ name: f.name.replace(/\.[^.]+$/, '') + '.jpg', origName: f.name, mime: 'image/jpeg', blob, isPhoto: true });
      } else {
        if (f.size > 3 * 1024 * 1024) { wStatus.textContent = f.name + ' — 3MB 초과라 웹에서는 못 올려요 (텔레그램으로 보내주세요)'; continue; }
        pending.push({ name: f.name, origName: f.name, mime: f.type || 'application/octet-stream', blob: f, isPhoto: false });
      }
    }
    rebuildFileList();
  });

  wFileList.addEventListener('click', (e) => {
    const rm = e.target.closest('.rmatt');
    if (rm) {
      pending.splice(parseInt(rm.dataset.i, 10), 1);
      rebuildFileList();
      return;
    }
    const b = e.target.closest('.inspin');
    if (!b) return;
    const ta = document.getElementById('wBody');
    const token = `\n[사진${b.dataset.n}]\n`;
    const s = ta.selectionStart ?? ta.value.length;
    const eIdx = ta.selectionEnd ?? ta.value.length;
    ta.value = ta.value.slice(0, s) + token + ta.value.slice(eIdx);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = s + token.length;
    queueDraft();
  });

  document.getElementById('wGo').addEventListener('click', async () => {
    const title = document.getElementById('wTitle').value.trim();
    if (!title) { wStatus.textContent = '제목을 입력해주세요'; return; }
    const key = sessionStorage.getItem('beaverkey') || '';
    const btn = document.getElementById('wGo');
    btn.disabled = true;
    wStatus.textContent = pending.length ? '첨부 올리는 중…' : '발행 중…';
    try {
      const files = [];
      for (const p of pending) files.push({ name: p.name, mime: p.mime, data: await toBase64(p.blob) });
      const r = await fetch('/api/write', {
        method: editingId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          key, title,
          post_id: editingId || undefined,
          body: document.getElementById('wBody').value,
          category: wCat.value,
          isPrivate: wPriv.checked,
          files,
        }),
      });
      const data = await r.json();
      if (!r.ok || !data.ok) throw new Error(data.error || 'fail');
      if (!editingId) { localStorage.removeItem(DRAFT_KEY); clearTimeout(draftTimer); }
      resetEditor();
      editor.classList.remove('show');
      load();
    } catch (e) {
      wStatus.textContent = e.message === 'wrong key' ? '비밀번호가 틀렸어요' : '발행 실패 — 잠시 후 다시 시도해주세요';
      if (e.message === 'wrong key') sessionStorage.removeItem('beaverkey');
    } finally {
      btn.disabled = false;
    }
  });

  load();

  // ── 방문자 카운트: 한 브라우저당 하루 1회만 집계 ──
  (async () => {
    try {
      const kstDay = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(new Date());
      const counted = localStorage.getItem('beavervisit') === kstDay;
      const r = await fetch('/api/visit', { method: counted ? 'GET' : 'POST' });
      const d = await r.json();
      if (typeof d.total === 'number') {
        if (!counted) localStorage.setItem('beavervisit', kstDay);
        document.getElementById('vToday').textContent = d.today.toLocaleString();
        document.getElementById('vTotal').textContent = d.total.toLocaleString();
        document.getElementById('visits').hidden = false;
      }
    } catch {}
  })();

  // ── 좋아요 / 댓글 / 공유 (이벤트 위임) ──
  list.addEventListener('click', async (e) => {
    // 사진 클릭 → 1.25배 확대 토글
    if (e.target.matches('.photos img')) {
      e.target.classList.toggle('zoomed');
      return;
    }

    // 글 수정 (주인장): 에디터에 불러오기
    const eb = e.target.closest('.editbtn');
    if (eb) {
      const p = posts.find((x) => String(x.id) === String(eb.dataset.id));
      if (!p) return;
      editingId = p.id;
      wTitleEl.value = p.title || '';
      wBodyEl.value = p.body || '';
      wCat.value = p.category || '생각';
      wPriv.checked = Boolean(p.is_private);
      wFiles.value = ''; pending = []; wFileList.textContent = '';
      document.getElementById('wGo').textContent = '수정 저장';
      document.querySelector('#editor h3').textContent = '통나무 다듬기 🪓';
      wStatus.textContent = '수정 중 — 기존 사진은 유지되고, 새로 첨부하면 추가됩니다';
      editor.classList.add('show');
      editor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }

    // 글 삭제 (주인장)
    const dp = e.target.closest('.delpost');
    if (dp) {
      if (!confirm('이 글을 삭제할까요? 댓글도 함께 지워지고 되돌릴 수 없습니다.')) return;
      try {
        const r = await fetch('/api/write', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: sessionStorage.getItem('beaverkey') || '', post_id: dp.dataset.id }),
        });
        const d = await r.json();
        if (d.ok) load();
        else alert('삭제 실패 — 로그인 상태를 확인해주세요');
      } catch {}
      return;
    }

    const like = e.target.closest('.likebtn');
    if (like) {
      const id = parseInt(like.dataset.id, 10);
      const action = liked.has(id) ? 'unlike' : 'like';
      try {
        const r = await fetch('/api/react', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ post_id: id, action }),
        });
        const data = await r.json();
        if (data.ok) {
          if (action === 'like') liked.add(id); else liked.delete(id);
          localStorage.setItem('beaverlikes', JSON.stringify([...liked]));
          like.classList.toggle('liked', action === 'like');
          like.innerHTML = `${action === 'like' ? '❤️' : '🤍'} <span class="likeN">${data.likes}</span>`;
        }
      } catch {}
      return;
    }

    const cbtn = e.target.closest('.cmtbtn');
    if (cbtn) {
      document.getElementById('cmts-' + cbtn.dataset.id)?.classList.toggle('show');
      return;
    }

    const share = e.target.closest('.sharebtn');
    if (share) {
      const url = location.origin + location.pathname + '?post=' + share.dataset.id;
      if (share.dataset.private === '1' && !confirm('비공개 글입니다. 링크를 받아도 비밀번호 없이는 내용이 보이지 않습니다. 계속할까요?')) return;
      try {
        if (navigator.share) {
          await navigator.share({ title: '비버의 저장소 🦫', url });
        } else {
          await navigator.clipboard.writeText(url);
          const old = share.innerHTML;
          share.innerHTML = '✅ 복사됨';
          setTimeout(() => { share.innerHTML = old; }, 1500);
        }
      } catch {}
      return;
    }

    const del = e.target.closest('.cmt .del');
    if (del) {
      if (!confirm('이 댓글을 삭제할까요?')) return;
      const key = sessionStorage.getItem('beaverkey') || '';
      try {
        const r = await fetch('/api/comment', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ comment_id: del.dataset.cid, key }),
        });
        if ((await r.json()).ok) load();
      } catch {}
      return;
    }

    const gbgo = e.target.closest('.gbgo');
    if (gbgo) {
      const nick = list.querySelector('.gnick').value.trim();
      const text = list.querySelector('.gbody').value.trim();
      const msg = document.getElementById('gbmsg');
      if (!/^[가-힣a-zA-Z]{1,12}$/.test(nick)) { msg.textContent = '닉네임은 한글/영어 1~12자로 입력해주세요'; return; }
      if (!text) { msg.textContent = '내용을 입력해주세요'; return; }
      gbgo.disabled = true; msg.textContent = '남기는 중…';
      try {
        const r = await fetch('/api/guestbook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname: nick, body: text }),
        });
        if ((await r.json()).ok) { await loadGuestbook(); }
        else { msg.textContent = '등록 실패 — 입력값을 확인해주세요'; }
      } catch { msg.textContent = '등록 실패 — 잠시 후 다시 시도해주세요'; }
      finally { gbgo.disabled = false; }
      return;
    }

    const gbdel = e.target.closest('.gbdel');
    if (gbdel) {
      if (!confirm('이 방명록 글을 삭제할까요?')) return;
      const key = sessionStorage.getItem('beaverkey') || '';
      try {
        const r = await fetch('/api/guestbook', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entry_id: gbdel.dataset.gid, pin: key }),
        });
        const d = await r.json();
        if (d.ok) loadGuestbook();
        else alert('삭제 권한이 없습니다');
      } catch {}
      return;
    }

    const cgo = e.target.closest('.cgo');
    if (cgo) {
      const box = cgo.closest('.cmtform');
      const bodyEl = box.querySelector('.cbody');
      const text = bodyEl.value.trim();
      if (!text) { bodyEl.focus(); return; }
      cgo.disabled = true;
      try {
        const r = await fetch('/api/comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            post_id: cgo.dataset.id,
            nickname: box.querySelector('.cnick').value,
            body: text,
          }),
        });
        if ((await r.json()).ok) {
          const openId = cgo.dataset.id;
          await load();
          document.getElementById('cmts-' + openId)?.classList.add('show');
        }
      } catch {} finally { cgo.disabled = false; }
    }
  });
</script>
